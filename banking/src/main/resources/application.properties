spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# MUST be overridden in production (min 32 chars)
jwt.secret=${JWT_SECRET:MySuperSecretKeyForJwtAuthentication12345}

# Comma-separated list of allowed frontend origins (only needed if frontend is on a different domain)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=${PORT:8080}
